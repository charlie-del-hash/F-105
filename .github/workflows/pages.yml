# Publishes the static demo to GitHub Pages.
#
# This is the serverless build: no API routes, no alert cron, no Supabase
# sign-in. The client computes quotes and series from the deterministic mock
# generator, so the demo still ticks. The full app belongs on Vercel, which
# builds the same repo with none of these constraints.
#
# The site is served from the generated `gh-pages` branch. That needs only
# `contents: write` — the Pages API used by actions/configure-pages cannot be
# called by the workflow token on this repo.
name: Pages

on:
  push:
    branches: [main, claude/f-105-portal-architecture-85zkz6]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build static demo
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build:static

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static demo from ${GITHUB_SHA:0:7}

          Generated by scripts/static-export.mjs. Do not edit by hand."
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
